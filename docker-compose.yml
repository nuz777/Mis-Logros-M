services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mislogros_games
      POSTGRES_USER: mislogros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD antes de levantar Postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mislogros -d mislogros_games"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
